name: Docs

on:
  release:
    types: [published]

  workflow_dispatch:

  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds use their own group so they never queue behind or cancel a release deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    uses: ghostdogpr/.github/.github/workflows/docs.yml@v1
